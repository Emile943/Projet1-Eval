#2 nœuds Debian (node1, node2) + le controller Ansible.

# Paramètres communs aux deux nœuds (ça évite de les écrire deux fois).
x-node: &node
  build: ./node
  # systemd a besoin de ces droits pour tourner comme PID 1 dans un conteneur.
  privileged: true
  cgroup: host
  tmpfs:
    - /run
    - /run/lock

services:
  node1:
    <<: *node
    hostname: node1
    ports:
      - "8081:80"   # page web : http://localhost:8081
      - "2221:22"
    volumes:
      - ./ssh/id_ed25519.pub:/etc/ssh/authorized_keys/ansible:ro

  node2:
    <<: *node
    hostname: node2
    ports:
      - "8082:80"   # http://localhost:8082
      - "2222:22"
    volumes:
      - ./ssh/id_ed25519.pub:/etc/ssh/authorized_keys/ansible:ro

  controller:
    build: ./controller
    hostname: controller
    depends_on:
      - node1
      - node2
    volumes:
      - ../ansible:/workspace/ansible
      - ./ssh/id_ed25519:/run/secrets/id_ed25519:ro

      #ports: "8081:80" : le port 80 du conteneur est accessible sur le port 8081 du PC, ce qui permettra de voir la page dans le navig.
      #volumes ... :ro : la clé publique est montée en lecture seule dans les nœuds.
      #../ansible : le dossier Ansible est monté dans le controller. 
      #S’il n’existe pas encore dans la branche, Docker en crée un vide
      #privileged: true : à ne faire qu’en local !!!!!!, jamais en prod.